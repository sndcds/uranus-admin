name: Deployment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          # PostgreSQL 16/PostGIS 3.4 and PostgreSQL 17/PostGIS 3.5.
          - postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
          - postgis/postgis@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: uranus_ansible_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d uranus_ansible_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ANSIBLE_TEST_DATABASE_URL: postgresql://postgres:local-fixture-only@127.0.0.1:5432/uranus_ansible_test
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_LOCAL_TEMP: /tmp/uranus-ansible-local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          python-version: "3.13.15"
          cache-dependency-glob: backend/uv.lock
      - run: uv run --locked --project backend ruff check --config backend/pyproject.toml ansible
      - run: uv run --locked --project backend ruff format --check --config backend/pyproject.toml ansible
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-controller.txt ansible-galaxy collection install -r ansible/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-controller.txt ansible-playbook -i ansible/inventory.example.yml ansible/deploy.yml --syntax-check
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-controller.txt ansible-playbook -i ansible/inventory.example.yml ansible/preflight.yml --syntax-check
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-test.txt python -m unittest discover -s ansible/tests -v
