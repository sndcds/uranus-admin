name: Deployment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    name: safety (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - stack: pg16-postgis342-production
            image: uranus-console-production-test:local
            build_context: ansible/tests/images/pg16-postgis342
            expected_stack: "160015/3.4.2"
          - stack: pg16-postgis343
            image: postgis/postgis@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
            expected_stack: "160004/3.4.3"
          - stack: pg17-postgis352
            image: postgis/postgis@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
            expected_stack: "170005/3.5.2"
    env:
      ANSIBLE_TEST_EXPECTED_STACK: ${{ matrix.expected_stack }}
      ANSIBLE_TEST_DATABASE_URL: postgresql://postgres:local-fixture-only@127.0.0.1:5432/uranus_ansible_test
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_LOCAL_TEMP: /tmp/uranus-ansible-local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start pinned disposable PostgreSQL/PostGIS fixture
        env:
          TEST_IMAGE: ${{ matrix.image }}
          TEST_BUILD_CONTEXT: ${{ matrix.build_context }}
        run: |
          if [ -n "$TEST_BUILD_CONTEXT" ]; then
            docker build --tag "$TEST_IMAGE" "$TEST_BUILD_CONTEXT"
          else
            docker pull "$TEST_IMAGE"
          fi
          docker run --detach --name console-db \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=local-fixture-only \
            --env POSTGRES_DB=uranus_ansible_test \
            "$TEST_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec console-db pg_isready -h 127.0.0.1 -U postgres -d uranus_ansible_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs console-db
          exit 1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.5"
          python-version: "3.13.15"
          cache-dependency-glob: backend/uv.lock
      - run: uv run --locked --project backend ruff check --config backend/pyproject.toml ansible
      - run: uv run --locked --project backend ruff format --check --config backend/pyproject.toml ansible
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-controller.txt ansible-galaxy collection install -r ansible/requirements.yml
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-controller.txt ansible-playbook -i ansible/inventory.example.yml ansible/deploy.yml --syntax-check
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-controller.txt ansible-playbook -i ansible/inventory.example.yml ansible/preflight.yml --syntax-check
      # Toolchain tests use local synthetic archives; no toolchain release downloads.
      - run: uv run --no-project --python 3.13 --with-requirements ansible/requirements-test.txt python -m unittest discover -s ansible/tests -v
      - name: Remove disposable fixture
        if: always()
        run: docker rm --force --volumes console-db
