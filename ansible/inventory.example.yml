all:
  children:
    uranus_admin:
      hosts:
        admin-production:
          ansible_host: admin-production.example.invalid
          ansible_user: awendelk
          ansible_port: 22
          # Keep strict host key verification; use your existing verified SSH alias.
          # Logical deployment environment, not a hostname allowlist.
          # Allowed: production, staging, test.
          ua_target_environment: production
          # Staging/test require their own HTTPS ua_public_origin; see README.
          ua_release_sha: "REPLACE_WITH_FULL_COMMIT_SHA"
          ua_artifact: "/absolute/controller/path/release.tar.gz"
          ua_artifact_sha256: "REPLACE_WITH_SHA256"
          # Build: /home/oklab/build/uranus-admin/.deployment-builds/<sha>.
          # Runtime/toolchain: /var/lib/uranus-admin. Local filesystems only.
          # Keep three completed build workspaces after success; never delete releases.
          ua_cleanup_builds: true
          # Python/uv/Node/pnpm paths are derived from the reviewed toolchain pins.
          # Do not override ua_python, ua_uv, ua_node or ua_pnpm.
          # No passwords, runtime DSNs or operator credentials belong in inventory.
