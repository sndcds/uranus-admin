all:
  children:
    uranus_admin:
      hosts:
        admin-production:
          ansible_host: admin-production.example.invalid
          ansible_user: awendelk
          ansible_port: 22
          # Keep strict host key verification; use your existing verified SSH alias.
          # Logical deployment environment, not a hostname allowlist.
          # Allowed: production, staging, test.
          ua_target_environment: production
          # Admin DB bootstrap is never allowed in production. On test/staging,
          # approval belongs only in the gitignored approvals.local.yml; see README.
          # Staging/test require their own HTTPS ua_public_origin; see README.
          ua_release_sha: "REPLACE_WITH_FULL_COMMIT_SHA"
          ua_artifact: "/absolute/controller/path/release.tar.gz"
          ua_artifact_sha256: "REPLACE_WITH_SHA256"
          # Python preparation: /home/oklab/build/uranus-admin/.deployment-builds/<sha>.
          # Runtime/toolchain: /var/lib/uranus-admin. Local filesystems only.
          # Keep three completed build workspaces after success; never delete releases.
          ua_cleanup_builds: true
          # Python/uv/Node paths are derived from the reviewed toolchain pins.
          # Do not override ua_python, ua_uv or ua_node. Frontend arrives prebuilt.
          # No passwords, runtime DSNs or operator credentials belong in inventory.
          # One private planner/vector SSH tunnel; provision trust and keys separately.
          # Runtime URLs use numeric loopback and these local ports; secrets stay in runtime.env.
          # ua_research_planner_tunnel_enabled: true
          # ua_research_planner_ssh_host: planner.example.invalid
          # ua_research_planner_ssh_port: 22
          # ua_research_planner_local_port: 8090
          # ua_research_planner_remote_port: 8090
          # ua_research_planner_qdrant_local_port: 6333
          # ua_research_planner_qdrant_remote_port: 6333
          # ua_research_planner_embedding_local_port: 6335
          # ua_research_planner_embedding_remote_port: 6335
          # All remote service targets are fixed to 127.0.0.1.
          # ua_research_planner_ssh_user: research-planner-tunnel
          # Key and known_hosts paths use protected /etc/uranus-admin defaults.
