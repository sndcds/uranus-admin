- name: Render the exact desired files in memory
  ansible.builtin.set_fact:
    ua_files:
      - path: /etc/systemd/system/uranus-admin-backend.service
        content: "{{ lookup('template', 'backend.service.j2') }}"
        mode: "0644"
      - path: /etc/systemd/system/uranus-admin-check-worker.service
        content: "{{ lookup('template', 'check-worker.service.j2') }}"
        mode: "0644"
      - path: /etc/systemd/system/uranus-admin-frontend.service
        content: "{{ lookup('template', 'frontend.service.j2') }}"
        mode: "0644"
      - path: /etc/nginx/sites-available/uranus-admin
        content: "{{ lookup('template', 'nginx-site.conf.j2') }}"
        mode: "0644"
      - path: /etc/nginx/conf.d/uranus-admin-logging.conf
        content: "{{ lookup('template', 'nginx-logging.conf.j2') }}"
        mode: "0644"
      - path: "{{ ua_config_dir }}/runtime.env"
        content: "{{ ua_runtime | ua_render_env }}"
        mode: "0600"
  no_log: true

- name: Render managed notification units for test and staging
  ansible.builtin.set_fact:
    ua_files: "{{ ua_files + [{'path': '/etc/systemd/system/uranus-admin-notification-worker.service', 'content': lookup('template', 'notification-worker.service.j2'), 'mode': '0644'}, {'path': '/etc/systemd/system/uranus-admin-notification-worker.timer', 'content': lookup('template', 'notification-worker.timer.j2'), 'mode': '0644'}] }}"
  when: ua_target_environment in ['staging', 'test'] and ua_manage_notification_timer | bool
  no_log: true

- name: Freeze the bounded infrastructure candidates
  ansible.builtin.set_fact:
    ua_infrastructure_candidates: "{{ ua_files | rejectattr('path', 'equalto', ua_config_dir + '/runtime.env') | list + [{'path': '/etc/nginx/conf.d/uranus-admin-ratelimit.conf', 'content': lookup('template', 'nginx-ratelimit.conf.j2'), 'mode': '0644'}] }}"
  no_log: true

- name: Inspect bootstrap file ownership and reject unreviewed existing contents
  uranus_infrastructure:
    environment: "{{ ua_target_environment }}"
    candidates: "{{ ua_infrastructure_candidates }}"
    services: "{{ ansible_facts.services.keys() | list }}"
    manage_notifications: "{{ ua_manage_notification_timer | bool }}"
  register: ua_infrastructure
  when: ua_target_environment in ['staging', 'test']

- name: Include bootstrap rate zones and managed file receipt in bounded recovery
  ansible.builtin.set_fact:
    ua_files: "{{ ua_files + [{'path': '/etc/nginx/conf.d/uranus-admin-ratelimit.conf', 'content': lookup('template', 'nginx-ratelimit.conf.j2'), 'mode': '0644'}, {'path': ua_config_dir + '/managed-infrastructure.json', 'content': ua_infrastructure.receipt, 'mode': '0600'}] }}"
  when: ua_target_environment in ['staging', 'test']
  no_log: true

- name: Report missing application infrastructure without creating it
  ansible.builtin.debug:
    msg:
      would_create_files: "{{ ua_infrastructure.would_create }}"
      would_create_nginx_site_symlink: "{{ ua_infrastructure.would_create_symlink }}"
      would_install_units: "{{ ua_infrastructure.missing_units }}"
      would_create_directories: "{{ ua_infrastructure.would_create_directories }}"
  when: ua_target_environment in ['staging', 'test']

- name: Sanitize the shared legacy environment only with notification management
  ansible.builtin.set_fact:
    ua_files: "{{ ua_files + [{'path': ua_legacy_root + '/backend/.env', 'content': ua_runtime | ua_render_env, 'mode': '0600'}] }}"
  # Planning also works before the second approval; the real apply gate still requires it.
  when: ua_manage_notification_timer | bool and (ua_target_environment == 'production' or ua_env_stats.results[2].stat.exists)
  no_log: true

- name: Compare installed files without emitting old contents or secret diffs
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    checksum_algorithm: sha256
  loop: "{{ ua_files }}"
  register: ua_file_stats
  no_log: true

- name: Reject symlinks at managed file destinations
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.isreg
  loop: "{{ ua_file_stats.results }}"
  no_log: true

- name: Reset the file change plan before comparison
  ansible.builtin.set_fact:
    ua_changed_paths: "{{ ['/etc/nginx/sites-enabled/uranus-admin'] if (ua_target_environment in ['staging', 'test'] and ua_infrastructure.would_create_symlink) else [] }}"

- name: Determine which file contents or permissions need changing
  ansible.builtin.set_fact:
    ua_changed_paths: "{{ (ua_changed_paths | default([])) + [item.item.path] }}"
  loop: "{{ ua_file_stats.results }}"
  when: >-
    not item.stat.exists or item.stat.checksum != (item.item.content | hash('sha256'))
    or item.stat.mode != item.item.mode or item.stat.uid != 0 or item.stat.gid != 0
  no_log: true

- name: Determine service-specific activation requirements
  ansible.builtin.set_fact:
    ua_activation: "{{ (ua_changed_paths | default([])) | ua_activation_plan(ansible_facts.services, ua_config_dir) }}"

- name: Store the exact activation plan
  ansible.builtin.set_fact:
    ua_changed_paths: "{{ ua_changed_paths | default([]) }}"
    ua_runtime_changed: "{{ ua_activation.runtime_changed }}"
    ua_nginx_changed: "{{ ua_activation.nginx_changed }}"
    ua_units_changed: "{{ ua_activation.units_changed }}"
    ua_restart_services: "{{ ua_activation.restart_services }}"

- name: Stop every managed application service for an admin schema upgrade
  ansible.builtin.set_fact:
    ua_restart_services: "{{ (ua_restart_services + ua_services) | unique | list }}"
  when: ua_admin_database_plan.admin_database.state | default('READY') == 'UPGRADEABLE'

- name: Report only safe file names and service decisions
  ansible.builtin.debug:
    msg:
      maintenance:
        enabled: "{{ ua_maintenance_page_enabled }}"
        public_window: "{{ ua_maintenance_public_window }}"
        activation_before_service_stop: "{{ ua_maintenance_page_enabled }}"
        expected_status: 503
        retry_after: "{{ ua_maintenance_retry_after }}"
        external_assets: false
      maintenance_page: "{{ 'enabled' if ua_maintenance_page_enabled else 'disabled' }}"
      maintenance_marker: "{{ ua_maintenance_marker }}"
      maintenance_public_window: "{{ ua_maintenance_public_window }}"
      would_enable_before_service_stop: "{{ ua_maintenance_page_enabled }}"
      would_verify_http_503: "{{ ua_maintenance_page_enabled }}"
      would_disable_after_healthchecks: "{{ ua_maintenance_page_enabled }}"
      maintenance_state_policy: "Preserve an already active marker; otherwise disable after local healthchecks."
      changed_files: "{{ ua_changed_paths }}"
      restart_services: "{{ ua_restart_services | default([]) }}"
      nginx_reload: "{{ ua_nginx_changed }}"
      notification_timer: "{{ ('Install and enable hourly timer after successful activation' if ua_target_environment in ['staging', 'test'] else 'Disable only under the separate approval; recover original state on failure') if ua_manage_notification_timer | bool else 'UNCHANGED (including shared legacy environment)' }}"
      secret_diffs: "Suppressed, including old unit contents. No password rotation."
      legacy_frontend_env: "Existing file will be restricted to root:root 0600 without content changes."
      release: "{{ ua_release_dir }} (build only when the verified completion marker is absent)"
      protected_paths: "{{ ua_config_dir }} (0700), operator.env and recovery files (0600)"
