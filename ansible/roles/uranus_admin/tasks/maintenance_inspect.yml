- name: Inspect maintenance directory boundaries
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ ua_maintenance_root }}"
    - "{{ ua_maintenance_root }}/assets"
  register: ua_maintenance_directories

- name: Reject redirected maintenance directories
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isdir and item.stat.uid == 0 and item.stat.mode == '0755')
  loop: "{{ ua_maintenance_directories.results }}"

- name: Snapshot original maintenance marker
  ansible.builtin.stat:
    path: "{{ ua_maintenance_marker }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: ua_previous_maintenance

- name: Reject unsafe markers or disabling an existing maintenance mode
  ansible.builtin.assert:
    that:
      - not (ua_previous_maintenance.stat.islnk | default(false))
      - not ua_previous_maintenance.stat.exists or (ua_previous_maintenance.stat.isreg and ua_previous_maintenance.stat.uid == 0 and ua_previous_maintenance.stat.mode == '0644')
      - not ua_previous_maintenance.stat.exists or ua_previous_maintenance.stat.size <= 4096
      - not ua_previous_maintenance.stat.exists or ua_maintenance_page_enabled

- name: Read bounded existing maintenance marker
  ansible.builtin.slurp:
    src: "{{ ua_maintenance_marker }}"
  register: ua_previous_maintenance_content
  when: ua_previous_maintenance.stat.exists
  no_log: true

# Compare encoded bytes exactly, including the final newline, without interpreting
# unknown operator contents as text or including them in recovery metadata.
- name: Classify previous maintenance ownership
  vars:
    ua_ansible_maintenance_content: "Ansible-managed maintenance\n"
  ansible.builtin.set_fact:
    ua_previous_maintenance_state: >-
      {{ 'absent' if not ua_previous_maintenance.stat.exists
         else 'ansible_owned'
         if ua_previous_maintenance_content.content == (ua_ansible_maintenance_content | b64encode)
         else 'operator_owned' }}
  no_log: true
