- name: Read the hostname
  ansible.builtin.command: hostname
  changed_when: false
  check_mode: false
  # Diagnostic only; every technical preflight below remains mandatory.
  failed_when: false
  register: ua_hostname

- name: Report target identity for diagnosis only
  ansible.builtin.debug:
    msg:
      target_environment: "{{ ua_target_environment }}"
      host_identity:
        inventory_hostname: "{{ inventory_hostname }}"
        system_hostname: "{{ ua_hostname.stdout | default('') | trim if ua_hostname.rc == 0 else 'unavailable' }}"

- name: Read the operating system release
  ansible.builtin.slurp:
    src: /etc/os-release
  register: ua_os_release

- name: Require the audited Ubuntu release
  ansible.builtin.assert:
    that:
      - "'ID=ubuntu' in (ua_os_release.content | b64decode)"
      - '''VERSION_ID="24.04"'' in (ua_os_release.content | b64decode)'

- name: Read the systemd version
  ansible.builtin.command: systemctl --version
  changed_when: false
  check_mode: false
  register: ua_systemd_version
  failed_when: ua_systemd_version.rc != 0 or not ua_systemd_version.stdout.startswith('systemd 255 ')

- name: Require the existing enabled Nginx site to reference the audited file
  ansible.builtin.stat:
    path: /etc/nginx/sites-enabled/uranus-admin
    follow: false
  register: ua_nginx_site_link

- name: Reject a different reverse proxy routing arrangement
  ansible.builtin.assert:
    that:
      - >-
        (not ua_nginx_site_link.stat.exists and ua_target_environment in ['staging', 'test'])
        or (ua_nginx_site_link.stat.islnk | default(false)
            and ua_nginx_site_link.stat.lnk_source | default('') == '/etc/nginx/sites-available/uranus-admin')
    fail_msg: "Nginx site link conflicts with the deployment contract."

- name: Inspect the managed site without following links
  ansible.builtin.stat:
    path: /etc/nginx/sites-available/uranus-admin
    follow: false
  register: ua_site_stat

- name: Require the production site baseline and reject conflicting site objects
  ansible.builtin.assert:
    that:
      - ua_site_stat.stat.exists or ua_target_environment in ['staging', 'test']
      - not ua_site_stat.stat.exists or ua_site_stat.stat.isreg | default(false)
      - not ua_site_stat.stat.islnk | default(false)
    fail_msg: "Nginx site conflicts with the deployment contract."

- name: Inspect the rate-zone file without following links
  ansible.builtin.stat:
    path: /etc/nginx/conf.d/uranus-admin-ratelimit.conf
    follow: false
  register: ua_rate_zone_stat

- name: Require an existing rate-zone baseline in production and reject redirected files
  ansible.builtin.assert:
    that:
      - ua_rate_zone_stat.stat.exists or ua_target_environment in ['staging', 'test']
      - not ua_rate_zone_stat.stat.exists or ua_rate_zone_stat.stat.isreg | default(false)
      - not ua_rate_zone_stat.stat.islnk | default(false)
    fail_msg: "Rate-zone file conflicts with the deployment contract."

- name: Read the existing rate-zone definitions
  ansible.builtin.slurp:
    src: /etc/nginx/conf.d/uranus-admin-ratelimit.conf
  register: ua_rate_zones
  when: ua_rate_zone_stat.stat.exists

- name: Require the audited rate zones without silently changing shared definitions
  ansible.builtin.assert:
    that:
      - >-
        (ua_rate_zones.content | b64decode | regex_replace('\\s+', ' ') | trim) ==
        'limit_req_zone $binary_remote_addr zone=uranus_admin_general:10m rate=10r/s; limit_req_zone $binary_remote_addr zone=uranus_admin_api:10m rate=5r/s; limit_conn_zone $binary_remote_addr zone=uranus_admin_conn:10m;'
    fail_msg: "Rate-zone configuration differs; review it before deployment."
  when: ua_rate_zones.content is defined

- name: Read service states
  ansible.builtin.service_facts:

- name: Require local storage and free space before installation or database access
  uranus_local_storage:
    paths:
      - "{{ ua_root }}"
      - "{{ ua_build_root }}"
      - /var/cache/uranus-admin-build
    min_free_bytes: "{{ ua_min_free_bytes }}"
  register: ua_local_storage

- name: Report inspected local build and runtime storage
  ansible.builtin.debug:
    var: ua_local_storage.filesystems

- name: Inspect managed directory boundaries without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ ua_root }}"
    - "{{ ua_root }}/releases"
    - "{{ ua_release_dir }}"
    - "{{ ua_release_dir }}/deployment"
    - "{{ ua_build_root }}"
    - "{{ ua_build_dir }}"
    - "{{ ua_config_dir }}"
    - "{{ ua_config_dir }}/recovery"
    - "{{ ua_config_dir }}/recovery/{{ ua_release_sha }}"
    - /var/cache/uranus-admin-build
  register: ua_directory_stats

- name: Refuse redirected managed directories
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.isdir
  loop: "{{ ua_directory_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Require the audited existing installation
  ansible.builtin.assert:
    that:
      - item in ansible_facts.services or (ua_target_environment in ['staging', 'test'] and item in ua_services)
    fail_msg: "Expected service missing; do not create an alternative installation automatically."
  loop: "{{ ua_services + ['nginx.service'] + (['uranus-admin-notification-worker.service'] if ua_manage_notification_timer | bool else []) }}"

- name: Reject unknown service drop-ins before taking over unit files
  ansible.builtin.command:
    argv: [systemctl, show, "{{ item }}", --property=DropInPaths, --value]
  loop: "{{ ua_services }}"
  changed_when: false
  check_mode: false
  register: ua_dropins
  failed_when: >-
    ua_dropins.stdout | trim | length > 0 or
    (ua_dropins.rc != 0 and not (ua_dropins.rc == 4 and ua_target_environment in ['staging', 'test'] and item not in ansible_facts.services))

- name: Reject alternate loaded unit locations on bootstrap targets
  ansible.builtin.command:
    argv: [systemctl, show, "{{ item }}", --property=FragmentPath, --value]
  loop: "{{ ua_services }}"
  changed_when: false
  check_mode: false
  register: ua_unit_fragment
  failed_when: ua_unit_fragment.rc != 0 or ua_unit_fragment.stdout | trim != '/etc/systemd/system/' + item
  when: ua_target_environment in ['staging', 'test'] and item in ansible_facts.services

- name: Require a stopped or reviewed existing notification timer
  ansible.builtin.command:
    argv:
      [
        systemctl,
        show,
        uranus-admin-notification-worker.timer,
        --property=LoadState,
        --value,
      ]
  changed_when: false
  check_mode: false
  register: ua_timer
  failed_when: ua_timer.rc != 0 or ua_timer.stdout | trim != 'loaded'
  when: ua_manage_notification_timer | bool

- name: Require a valid existing complete Nginx configuration
  ansible.builtin.command: /usr/sbin/nginx -t
  register: ua_nginx_validation
  failed_when: ua_nginx_validation.rc != 0 or 'conflicting server name' in (ua_nginx_validation.stderr | default(''))
  changed_when: false
  check_mode: false
  no_log: true

- name: Inspect and provision the isolated toolchain before any database access
  ansible.builtin.import_tasks: toolchain.yml
  when: ua_target_environment == 'production'

- name: Read database identity and mandatory object guards
  community.postgresql.postgresql_query:
    login_db: oklab
    login_user: postgres
    login_unix_socket: "{{ ua_pg_socket }}"
    login_port: "{{ ua_pg_port }}"
    connect_params:
      options: "-c default_transaction_read_only=on -c statement_timeout=10000 -c lock_timeout=2000 -c search_path=pg_catalog"
    query: >-
      SELECT current_database() = 'oklab' AS correct_database,
      current_setting('transaction_read_only') = 'on' AS read_only,
      to_regnamespace('uranus') IS NOT NULL AS source_schema,
      to_regclass('uranus.event') IS NOT NULL AS event,
      to_regclass('uranus.event_date') IS NOT NULL AS event_date,
      to_regclass('uranus.venue') IS NOT NULL AS venue,
      to_regclass('uranus.organization') IS NOT NULL AS organization,
      EXISTS(SELECT 1 FROM pg_extension WHERE extname='postgis') AS postgis
  become_user: postgres
  changed_when: false
  register: ua_db_guard

- name: Stop on missing or wrong database objects without repairing anything
  ansible.builtin.assert:
    that: ua_db_guard.query_result[0].values() | list | min
    fail_msg: "Wrong database or missing source/PostGIS objects; source provisioning is never permitted."

- name: Classify admin database state without changing objects or privileges
  uranus_admin_database:
    state: plan
    environment: "{{ ua_target_environment }}"
    approved: "{{ ua_admin_database_bootstrap_approved }}"
    manifest: "{{ ua_manifest }}"
    boundary: "{{ lookup('file', role_path + '/files/boundary.sql') }}"
  become_user: postgres
  register: ua_admin_database_plan

- name: Report the safe admin database contract and proposed first installation
  ansible.builtin.debug:
    msg:
      admin_database: "{{ ua_admin_database_plan.admin_database }}"

- name: Require READY or a clean non-production ABSENT database
  ansible.builtin.assert:
    that:
      - ua_admin_database_plan.admin_database.state == 'READY' or ua_admin_database_plan.admin_database.bootstrap_allowed
    fail_msg: "Admin database is absent in production or DRIFTED. No automatic repair or migration is permitted. Review admin_database.blockers."

- name: Require separate admin bootstrap approval before any real preparation
  ansible.builtin.assert:
    that: ua_admin_database_bootstrap_approved is sameas true
    fail_msg: "Clean admin bootstrap requires ua_admin_database_bootstrap_approved=true in the protected local approval file."
  when:
    - ua_admin_database_plan.admin_database.state == 'ABSENT'
    - ua_action == 'deploy'
    - not ansible_check_mode

- name: Read optional orientation counts without any equality guard
  community.postgresql.postgresql_query:
    login_db: oklab
    login_user: postgres
    login_unix_socket: "{{ ua_pg_socket }}"
    login_port: "{{ ua_pg_port }}"
    connect_params:
      options: "-c default_transaction_read_only=on -c statement_timeout=10000 -c lock_timeout=2000"
    query:
      - SELECT COUNT(*) FROM uranus.event
      - SELECT COUNT(*) FROM uranus.event_date
      - SELECT COUNT(*) FROM uranus.venue
      - SELECT COUNT(*) FROM uranus.organization
  become_user: postgres
  changed_when: false
  when: ua_counts | bool
