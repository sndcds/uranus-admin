- name: Require a valid target environment and safe paths
  ansible.builtin.assert:
    that:
      - ua_map_tile_url | ua_valid_map_tiles(ua_map_tile_attribution, ua_map_tile_attribution_url)
      - ua_action in ['inspect', 'deploy']
      - ua_target_environment is string
      - ua_target_environment in ['production', 'staging', 'test']
      - ua_admin_database_bootstrap_approved is boolean
      - ua_admin_database_upgrade_approved is boolean
      - ua_public_origin | ua_valid_target_origin(ua_target_environment)
      - ua_nginx_server_name == (ua_public_origin | urlsplit('hostname'))
      - ua_tls_certificate is match('^/[A-Za-z0-9_./-]+$') and '..' not in ua_tls_certificate.split('/')
      - ua_tls_certificate_key is match('^/[A-Za-z0-9_./-]+$') and '..' not in ua_tls_certificate_key.split('/')
      - ua_target_environment != 'production' or ua_tls_certificate == '/etc/letsencrypt/live/admin.kulturbytes.de/fullchain.pem'
      - ua_target_environment != 'production' or ua_tls_certificate_key == '/etc/letsencrypt/live/admin.kulturbytes.de/privkey.pem'
      - ua_root == '/var/lib/uranus-admin'
      - ua_legacy_root == '/home/oklab/build/uranus-admin'
      - ua_build_root == '/home/oklab/build/uranus-admin/.deployment-builds'
      - ua_min_free_bytes | int >= 6442450944
      - ua_config_dir == '/etc/uranus-admin'
      - ua_maintenance_page_enabled is boolean
      - ua_maintenance_root == '/var/lib/uranus-admin/maintenance'
      - ua_maintenance_marker == ua_maintenance_root + '/enabled'
      - ua_maintenance_retry_after is integer
      - ua_maintenance_retry_after >= 1 and ua_maintenance_retry_after <= 86400
      - ua_maintenance_public_title is string and 0 < ua_maintenance_public_title | length <= 200
      - ua_maintenance_public_message is string and 0 < ua_maintenance_public_message | length <= 2000
      - ua_maintenance_public_window is string and ua_maintenance_public_window | length <= 200
      - ua_service_user == 'oklab' and ua_service_group == 'oklab'
      - ua_services == ['uranus-admin-backend.service', 'uranus-admin-check-worker.service', 'uranus-admin-frontend.service']
      - ua_notification_units == ['uranus-admin-notification-worker.service', 'uranus-admin-notification-worker.timer']
      - ua_pg_port | int == 5432
      - ua_pg_socket == '/var/run/postgresql'
      - ansible_run_tags | list | unique | sort == ['all']
      - ansible_skip_tags | length == 0
    fail_msg: "Target does not satisfy the Uranus Admin deployment contract. Do not bypass preflight or safety gates."

- name: Require the reviewed maintenance and secret-adoption decisions for a real apply
  ansible.builtin.assert:
    that:
      - ua_apply_confirmation == 'Ja, führe das Deployment jetzt aus.'
      - ua_reviewed_dry_run | length > 0
      - ua_maintenance_window | length > 0
      - ua_backup_reference | length > 0
      - not (ua_manage_notification_timer | bool) or (ua_disable_notification_timer_approved | bool)
      - ua_secret_adoption_approved | bool
    fail_msg: "Apply requires reviewed dry run, backup reference, maintenance window, secret approval and separate approval when managing notifications."
  when: ua_action == 'deploy' and not ansible_check_mode

- name: Authenticate and inspect the controller artifact without extraction
  ansible.builtin.set_fact:
    ua_manifest: "{{ ua_artifact | ua_manifest(ua_artifact_sha256, ua_release_sha) }}"
    ua_release_dir: "{{ ua_root }}/releases/{{ ua_release_sha }}"
    ua_build_dir: "{{ ua_build_root }}/{{ ua_release_sha }}"
