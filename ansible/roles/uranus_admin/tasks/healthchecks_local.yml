- name: Check backend liveness and database readiness
  ansible.builtin.uri:
    url: "http://127.0.0.1:8011/{{ item }}"
    status_code: 200
    return_content: false
    follow_redirects: none
    use_proxy: false
    timeout: 10
  loop: [health, ready]
  register: ua_health
  until: ua_health.status == 200
  retries: 10
  delay: 2

- name: Check local frontend login while public maintenance is active
  ansible.builtin.uri:
    url: http://127.0.0.1:3011/login
    method: GET
    status_code: 200
    follow_redirects: none
    return_content: false
    use_proxy: false
    timeout: 10
  register: ua_frontend_health
  until: ua_frontend_health.status == 200
  retries: 10
  delay: 2

- name: Check the enabled planner tunnel without credentials or inference
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ua_research_planner_local_port }}/health"
    method: GET
    status_code: 200
    return_content: false
    follow_redirects: none
    use_proxy: false
    use_netrc: false
    timeout: 5
  register: ua_planner_health
  until: >-
    ua_planner_health.status | default(0) == 200 and ua_planner_health.json | default({}) == {'status': 'ok'}
  retries: 10
  delay: 2
  no_log: true
  when: ua_research_planner_tunnel_enabled | bool

- name: Verify enabled planner tunnel service is active independently of HTTP health
  ansible.builtin.command:
    argv: [systemctl, is-active, uranus-admin-research-planner-tunnel.service]
  changed_when: false
  register: ua_planner_active
  failed_when: ua_planner_active.rc != 0 or ua_planner_active.stdout | trim != 'active'
  when: ua_research_planner_tunnel_enabled | bool

- name: Check local vector forwards without credentials or inference
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: started
    connect_timeout: 2
    timeout: 30
  loop:
    - "{{ ua_research_planner_qdrant_local_port }}"
    - "{{ ua_research_planner_embedding_local_port }}"
  when: ua_research_vector_enabled
