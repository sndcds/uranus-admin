# Only bounded files and service state. No application CLI, HTTP probes or database access.
- name: Reestablish maintenance before system recovery including failed disable
  ansible.builtin.copy:
    content: "Ansible-managed maintenance\n"
    dest: "{{ ua_maintenance_marker }}"
    force: false
    owner: root
    group: root
    mode: "0644"
  when: ua_maintenance_attempted | bool

- name: Inspect loaded geocode units before recovery
  ansible.builtin.command:
    argv: [systemctl, show, "{{ item }}", --property=LoadState, --value]
  loop: "{{ ua_geocode_units | reverse | list }}"
  register: ua_recovery_geocode_units
  changed_when: false
  failed_when: >-
    not ((ua_recovery_geocode_units.rc == 0 and ua_recovery_geocode_units.stdout | trim == 'loaded') or
         (ua_recovery_geocode_units.rc in [0, 4] and ua_recovery_geocode_units.stdout | trim == 'not-found'))
  when: ua_geocode_touched | bool

- name: Stop geocode scheduling and invocation before restoring files
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: "{{ false if item.item.endswith('.timer') else omit }}"
  loop: "{{ ua_recovery_geocode_units.results | default([]) }}"
  when: ua_geocode_touched | bool and item.stdout | default('') | trim == 'loaded'

- name: Inspect services installed during bootstrap before recovery
  ansible.builtin.service_facts:
  register: ua_recovery_service_facts
  when: ua_target_environment in ['staging', 'test']

- name: Stop affected application services before restoring their configuration
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ ua_restart_services }}"
  when: ua_services_stop_attempted | bool and (ua_previous_services[item].exists or item in ua_recovery_service_facts.ansible_facts.services)

- name: Disable newly installed services before removing their units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ ua_restart_services }}"
  when: not ua_previous_services[item].exists and item in ua_recovery_service_facts.ansible_facts.services

- name: Inspect loaded notification units before bootstrap recovery
  ansible.builtin.command:
    argv: [systemctl, show, "{{ item }}", --property=LoadState, --value]
  loop: "{{ ua_notification_units | reverse | list }}"
  register: ua_recovery_notification_units
  changed_when: false
  failed_when: >-
    not ((ua_recovery_notification_units.rc == 0 and ua_recovery_notification_units.stdout | trim == 'loaded') or
         (ua_recovery_notification_units.rc in [0, 4] and ua_recovery_notification_units.stdout | trim == 'not-found'))
  when:
    - ua_target_environment in ['staging', 'test']
    - ua_manage_notification_timer | bool
    - ua_install_attempted | bool

- name: Stop managed bootstrap notifications before restoring their unit files
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: "{{ false if item.item.endswith('.timer') else omit }}"
  loop: "{{ ua_recovery_notification_units.results | default([]) }}"
  when:
    - ua_target_environment in ['staging', 'test']
    - ua_manage_notification_timer | bool
    - ua_disable_notification_timer_approved | bool
    - ua_services_stop_attempted | bool
    - ua_install_attempted | bool
    - item.stdout | default('') | trim == 'loaded'

- name: Remove only the site link absent before bootstrap
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/uranus-admin
    state: absent
  when: ua_target_environment in ['staging', 'test'] and ua_infrastructure.would_create_symlink and ua_install_attempted

- name: Restore previous managed file contents and permissions
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.backup }}"
    dest: "{{ item.path }}"
    owner: "{{ item.uid | string }}"
    group: "{{ item.gid | string }}"
    mode: "{{ item.mode }}"
  loop: "{{ ua_recovery_files }}"
  when: item.exists
  no_log: true
  diff: false

- name: Remove only managed configuration files absent before this attempt
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ua_recovery_files }}"
  when: not item.exists
  no_log: true
  diff: false

- name: Restore legacy frontend environment ownership and permissions
  ansible.builtin.file:
    path: "{{ ua_legacy_root }}/frontend/.env"
    owner: "{{ ua_previous_frontend_env.stat.uid | string }}"
    group: "{{ ua_previous_frontend_env.stat.gid | string }}"
    mode: "{{ ua_previous_frontend_env.stat.mode }}"
  when: ua_previous_frontend_env.stat.exists

- name: Restore the previous release pointer if publication was attempted
  ansible.builtin.file:
    src: "{{ ua_previous_current.stat.lnk_target }}"
    dest: "{{ ua_root }}/current"
    state: link
    follow: false
    owner: "{{ ua_previous_current.stat.uid | string }}"
    group: "{{ ua_previous_current.stat.gid | string }}"
  when: ua_pointer_attempted | bool and ua_previous_current.stat.exists

- name: Remove the release pointer if it did not exist before publication
  ansible.builtin.file:
    path: "{{ ua_root }}/current"
    state: absent
  when: ua_pointer_attempted | bool and not ua_previous_current.stat.exists

- name: Reload restored systemd unit definitions
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ua_units_changed | bool

- name: Verify restored nginx configuration before any reload
  ansible.builtin.command: /usr/sbin/nginx -t
  register: ua_nginx_validation
  failed_when: ua_nginx_validation.rc != 0 or 'conflicting server name' in (ua_nginx_validation.stderr | default(''))
  changed_when: false
  no_log: true

- name: Restore affected application services to their actual previous states
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: "{{ 'started' if ua_previous_services[item].active else 'stopped' }}"
    enabled: "{{ ua_previous_services[item].enabled }}"
  loop: "{{ ua_restart_services }}"
  when: ua_services_stop_attempted | bool and ua_previous_services[item].exists

- name: Restore the previous geocode invocation and timer states
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: "{{ 'started' if ua_previous_services[item].active else 'stopped' }}"
    enabled: "{{ omit if ua_previous_services[item].unit_file_state == 'static' else ua_previous_services[item].enabled }}"
  loop: "{{ ua_geocode_units }}"
  when: ua_geocode_touched | bool and ua_previous_services[item].exists

- name: Restore the managed notification service and timer to their previous states
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: "{{ 'started' if ua_previous_services[item].active else 'stopped' }}"
    enabled: "{{ omit if ua_previous_services[item].unit_file_state == 'static' else ua_previous_services[item].enabled }}"
  loop:
    - uranus-admin-notification-worker.service
    - uranus-admin-notification-worker.timer
  when:
    - ua_services_stop_attempted | bool
    - ua_manage_notification_timer | bool
    - ua_disable_notification_timer_approved | bool
    - ua_previous_services[item].exists

# Keep the loaded maintenance-capable proxy while old services are restored.
# First adoption may restore a legacy vhost without marker support.
- name: Reload the valid previous nginx configuration
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded
  when: ua_nginx_changed | bool and ua_install_attempted | bool

- name: Restore originally inactive maintenance only after successful system recovery
  ansible.builtin.file:
    path: "{{ ua_maintenance_marker }}"
    state: absent
  when: ua_maintenance_attempted | bool and not ua_previous_maintenance.stat.exists
