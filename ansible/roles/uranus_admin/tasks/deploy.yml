- name: Plan managed application files and conflicts
  ansible.builtin.import_tasks: file_plan.yml

- name: Stage the release and verify it before interrupting existing services
  ansible.builtin.import_tasks: release.yml
  when: not ansible_check_mode

- name: Simulate candidate file installation without exposing previous contents
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ ua_files[:5] }}"
  loop_control:
    label: "{{ item.path }}"
  # Old unit/site files could contain inline credentials. Review the new templates locally.
  diff: false
  # Missing parents are reported by the read-only bootstrap plan; copy cannot simulate them.
  when: ansible_check_mode and ua_target_environment == 'production'

- name: Prepare a per-attempt system snapshot and dispatch guarded activation
  ansible.builtin.import_tasks: prepare_activation.yml
  when: not ansible_check_mode
