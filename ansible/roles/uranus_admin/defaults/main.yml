ua_action: inspect
ua_expected_hostname: webserver
ua_release_sha: ""
ua_artifact: ""
ua_artifact_sha256: ""
# Every real deployment needs explicit approval after a reviewed dry run.
ua_apply_confirmation: ""
ua_reviewed_dry_run: ""
ua_maintenance_window: ""
ua_backup_reference: ""
ua_manage_notification_timer: false
ua_disable_notification_timer_approved: false
ua_secret_adoption_approved: false
ua_sql_console_provision_approved: false
ua_debug: false
ua_runtime_overrides: {}
ua_root: /var/lib/uranus-admin
ua_legacy_root: /home/oklab/build/uranus-admin
ua_build_root: /home/oklab/build/uranus-admin/.deployment-builds
# Free-space floor for build, release/toolchain and cache filesystems (not a size guarantee).
ua_min_free_bytes: 6442450944
ua_cleanup_builds: true
ua_config_dir: /etc/uranus-admin
ua_service_user: oklab
ua_service_group: oklab
ua_pg_socket: /var/run/postgresql
ua_pg_port: 5432
ua_counts: false
ua_services:
  - uranus-admin-backend.service
  - uranus-admin-check-worker.service
  - uranus-admin-frontend.service

# Public copy is separate from the private operator approval ua_maintenance_window.
ua_maintenance_page_enabled: true
ua_maintenance_root: /var/lib/uranus-admin/maintenance
# Nginx cannot traverse the secret configuration directory (0700).
ua_maintenance_marker: /var/lib/uranus-admin/maintenance/enabled
ua_maintenance_retry_after: 300
ua_maintenance_public_title: "Kurze Wartungsarbeiten"
ua_maintenance_public_message: >-
  Wir aktualisieren gerade das Kulturbytes Admin-System.
  Die Anwendung ist in Kürze wieder verfügbar.
  Bitte versuche es in wenigen Minuten erneut.
ua_maintenance_public_window: ""
