ua_action: inspect
# Logical environment only; all targets require the same safety gates.
ua_target_environment: production
# Bootstrap targets must explicitly select their own HTTPS origin and trusted certificate.
ua_public_origin: https://admin.kulturbytes.de
ua_nginx_server_name: "{{ ua_public_origin | urlsplit('hostname') }}"
ua_tls_certificate: "/etc/letsencrypt/live/{{ ua_nginx_server_name }}/fullchain.pem"
ua_tls_certificate_key: "/etc/letsencrypt/live/{{ ua_nginx_server_name }}/privkey.pem"
# Public OSM Standard tiles for manual admin inspection; empty explicitly disables the map.
ua_map_tile_url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
ua_map_tile_attribution: ""
ua_map_tile_attribution_url: ""
ua_release_sha: ""
ua_artifact: ""
ua_artifact_sha256: ""
# Production uses manual approval; the test/staging controller can record a successful dry run.
ua_apply_confirmation: ""
ua_reviewed_dry_run: ""
ua_maintenance_window: ""
ua_backup_reference: ""
ua_manage_notification_timer: false
ua_disable_notification_timer_approved: false
ua_notification_units:
  - uranus-admin-notification-worker.service
  - uranus-admin-notification-worker.timer
ua_geocode_units:
  - uranus-admin-geocode-worker.service
  - uranus-admin-geocode-worker.timer
ua_secret_adoption_approved: false
ua_admin_database_bootstrap_approved: false
ua_admin_database_upgrade_approved: false
ua_sql_console_provision_approved: false
ua_debug: false
ua_runtime_overrides: {}
ua_root: /var/lib/uranus-admin
ua_legacy_root: /home/oklab/build/uranus-admin
ua_build_root: /home/oklab/build/uranus-admin/.deployment-builds
# Target workspaces are for Python preparation only; frontend arrives prebuilt.
# Free-space floor for preparation, release/toolchain and cache filesystems.
ua_min_free_bytes: 6442450944
ua_cleanup_builds: true
ua_config_dir: /etc/uranus-admin
ua_service_user: oklab
ua_service_group: oklab
ua_pg_socket: /var/run/postgresql
ua_pg_port: 5432
ua_counts: false
ua_services:
  - uranus-admin-backend.service
  - uranus-admin-check-worker.service
  - uranus-admin-frontend.service

# Public copy is separate from the private operator approval ua_maintenance_window.
ua_maintenance_page_enabled: true
ua_maintenance_root: /var/lib/uranus-admin/maintenance
# Nginx cannot traverse the secret configuration directory (0700).
ua_maintenance_marker: /var/lib/uranus-admin/maintenance/enabled
ua_maintenance_retry_after: 300
ua_maintenance_public_title: "Kurze Wartungsarbeiten"
ua_maintenance_public_message: >-
  Wir aktualisieren gerade das Kulturbytes Admin-System.
  Die Anwendung ist in Kürze wieder verfügbar.
  Bitte versuche es in wenigen Minuten erneut.
ua_maintenance_public_window: ""
