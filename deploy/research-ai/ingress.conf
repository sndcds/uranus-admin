# Dedicated ports reuse the existing certificate; ordinary Nominatim vhost is unchanged.
server {
    listen 7443 ssl;
    server_name nominatim.oklabflensburg.de;
    ssl_certificate /etc/letsencrypt/live/nominatim.oklabflensburg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nominatim.oklabflensburg.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 89.58.56.254;
    deny all;
    access_log off;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:6333;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
server {
    listen 7444 ssl;
    server_name nominatim.oklabflensburg.de;
    ssl_certificate /etc/letsencrypt/live/nominatim.oklabflensburg.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nominatim.oklabflensburg.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 89.58.56.254;
    deny all;
    access_log off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    location / {
        proxy_pass http://127.0.0.1:6335;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_connect_timeout 5s;
    }
}
